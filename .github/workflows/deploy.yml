# GitHub Actions 工作流程文件
name: 自动部署为 GitPage 静态网站

on:
  push:
    branches: [master] # 当推送到 master 分支时触发
  workflow_dispatch: # 允许手动触发

# 官方 actions/deploy-pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免同时部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建 job
  build:
    name: 构建 VitePress 站点
    runs-on: ubuntu-latest

    steps:
      - name: 1、检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 如果未启用 lastUpdated，则不需要完整历史记录

      - name: 2、安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1 # 与 package.json 中的 pnpm@10.13.1 保持一致

      - name: 3、安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm' # 自动缓存 pnpm 依赖，大幅提速

      - name: 4、安装依赖
        run: pnpm install --frozen-lockfile

      - name: 5、构建 VitePress 站点
        run: pnpm run docs:build

      - name: 6、上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist # 对应你的 VitePress outDir 配置

  # 部署 job
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
